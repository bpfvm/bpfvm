## openssl-bpf.conf — bpfvm 目标的 OpenSSL Configure 配置。
# 经 `./Configure --config=cmake/openssl-bpf.conf bpf-unknown-none ...` 注入，不改源码。
#
#   inherit_from => ["BASE_unix"]   复用 AR=ar / build_scheme=[unified,unix]（BPF 用宿主 GNU ar）。
#   CC => "clang"                   实际由 scripts/env.sh 包成 CLANG_WRAPPER（链接种点重定向到 bpfvm-ld）。
#   cflags/lib_cppflags             只放 OpenSSL 语义 flags（BPF target/pass flags 由调用方经 CFLAGS 注入）：
#       -DL_ENDIAN                  BPF 小端 64 位。
#       threads("-D_REENTRANT")     仅当命令行传 "threads" 时展开（musl 重入函数可见性）。
#   bn_ops => "SIXTY_FOUR_BIT_LONG" BN_ULONG=unsigned long（64 位）。__int128 全局启用
#                                   （build_root.sh -D__SIZEOF_INT128__=16）：BN_UMULT_HIGH/LOHI 与
#                                   curve448/curve25519 域运算都产生 i128，BpfSoftFp pass 把
#                                   mul/sdiv/udiv/srem/urem i128 与变量 shl/lshr i128 改写成虚拟指令
#                                   （BPF_FP_MUL128 / BPF_FP_*DIV128 / 拆半移位）软化，add/sub/phi 等
#                                   其余 i128 运算由后端原生拆成 (lo:i64,hi:i64)，不再触发 __multi3/
#                                   __ashlti3。比 THIRTY_FOUR_BIT 的 4x32x32 拆解快得多（RSA 核心瓶颈）。
#                                   需 build_root.sh 给 CFLAGS 加 -UOPENSSL_NO_ASM（见 bn_local.h:362
#                                   的 !OPENSSL_NO_ASM 守卫）——只影响预处理宏，不拉入 asm 源文件
#                                   （asm 源列表由 build.info 的 !$disabled{asm} 控制，与 CFLAGS 无关）。
#   thread_scheme => "pthreads"     启用 CRYPTO_THREAD_lock 等并发保护（本 VM 多线程已就绪）。
#   sys_id => "BPFVM"               生成 -DOPENSSL_SYS_BPFVM 钩子；getentropy() 弱符号命中 musl getrandom。
#   不设 asm_arch                   -> Configure 强制 no-asm（BPF 无 asm 后端）。
#   不设 shared_target/module_ld    -> OpenSSL 自动 disable shared/pic/module（provider 静态链入 libcrypto）。
#
# ex_libs 不加 -lpthread：pthread 符号已在 libc.a，bpfvm-ld 也不识别 gcc 的 -pthread。
# 命令行 no-* 裁剪见 scripts/build_root.sh 的 build_openssl 函数。

my %targets = (
    "bpf-unknown-none" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "clang",
        CXX              => "clang++",
        # 不加 -Wall：BpfWideArgs pass 改写后的 IR 类型与源码字面不完全一致，-Wall 升 error 是噪声。
        cflags           => add(combine("-DL_ENDIAN",
                                       threads("-D_REENTRANT"))),
        cxxflags         => add(combine("-DL_ENDIAN",
                                        threads("-D_REENTRANT"))),
        lib_cppflags     => add("-DL_ENDIAN"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        thread_scheme    => "pthreads",
        sys_id           => "BPFVM",
    },
);
